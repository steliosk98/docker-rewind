name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # Plain cross-compilation. No goreleaser: one `go build` per target is
      # less machinery than a config file describing how to run `go build`.
      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          v="${GITHUB_REF_NAME#v}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/rewind-${v}-${os}-${arch}"
            [ "$os" = windows ] && bin="rewind.exe" || bin="rewind"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "$bin" .
            tar czf "${out}.tar.gz" "$bin" README.md LICENSE
            rm -f "$bin"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
